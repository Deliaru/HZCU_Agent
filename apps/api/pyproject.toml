[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hzcu-campus-agent-api"
version = "0.1.0"
description = "Model-native campus cognitive agent for HZCU"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22,<1",
  "alembic>=1.18,<2",
  "anthropic>=0.75,<1",
  "asyncpg>=0.31,<1",
  "beautifulsoup4>=4.14,<5",
  "cryptography>=46,<47",
  "fastapi>=0.140,<1",
  "httpx[socks]>=0.28,<1",
  "openai>=2.48,<3",
  "pypdf>=6.14,<7",
  "pydantic-settings>=2.12,<3",
  "pyyaml>=6.0,<7",
  "sqlalchemy>=2.0.51,<3",
  "sse-starlette>=3.2,<4",
  "uvicorn[standard]>=0.41,<1",
]

[project.scripts]
hzcu-agent = "hzcu_agent.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hzcu_agent"]

[tool.pytest.ini_options]
addopts = "-s"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
