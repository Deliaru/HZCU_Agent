# HZCU Campus Agent — Source Registry（白名单，不是爬虫入口）
#
# 网络与 502 提示
# ----------------
# 不少学院/部门站（教务 hzcujwb、团委 tw、学工 xgb 等）在公网或经 Clash 代理时
# 会 502 / SSL 异常。运维与验收时请：
#   1. 用学校统一身份（SSO）登录 https://vpn.hzcu.edu.cn （aTrust 客户端亦可）；
#   2. 走 VPN 可达路径后再跑 sync（Windows aTrust 直连优先；勿让 Clash 7890 劫持）；
#   3. 部分站也提供 host 前缀内网入口，形如：
#        http://{host-with-dashes}.vpn.hzcu.edu.cn:8118/
#      例：http://tw-hzcu-edu-cn.vpn.hzcu.edu.cn:8118/
#          http://hzcujwb-hzcu-edu-cn.vpn.hzcu.edu.cn:8118/
#   4. 当前 connector 登记的是直连 host（http/https 精确白名单）。VPN 前缀域名
#      若要作为 fetch 目标，需另增 allowed_hosts / seed，或先在 VPN 下解析到
#      与登记 host 一致的可达路由后再同步。
#
# 安全
# ----
# - 本文件是公开/校园信息源白名单，禁止写入账号、密码、Cookie、Token。
# - VPN/SSO 凭证只放在本机环境或密钥管理中，仅用于人工登录与网络打通，
#   不得进入 Source Registry、快照或仓库。
# - 发现阶段可用操作员凭证探路；入库同步仍只抓 allowlist 上的公开/校园页。
#
# 明细与契约：research/source-discovery/registry/
# 运行手册：docs/14-source-registry-operations.md

version: 1
sources:
  - id: hzcu-main
    name: 浙大城市学院主站
