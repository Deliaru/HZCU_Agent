name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Install API dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e "apps/api[dev]"
      - name: Lint and format check
        run: |
          .venv/bin/ruff check apps/api/src apps/api/tests
          .venv/bin/ruff format --check apps/api/src apps/api/tests
      - name: Verify database migration
        env:
          HZCU_ENVIRONMENT: test
          HZCU_DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db
        run: .venv/bin/alembic -c apps/api/alembic.ini upgrade head
      - name: Test API
        run: .venv/bin/pytest apps/api/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Type-check and build
        working-directory: apps/web
        run: |
          npm run typecheck
          npm run build
